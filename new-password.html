<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // ===== Supabase 설정 =====
    const SUPABASE_URL = "https://buokcgkkgwxsvtomoozw.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_idk2RhzFi8DYpMH3Z2ZE5w_JtgWXDbM";
    // ========================
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 비밀번호</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="logo-mark">P</span>
      <span>내 포트폴리오</span>
    </a>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>새 비밀번호</h1>

      <!-- 재설정 링크 확인이 끝나기 전까지 숨김 -->
      <form id="password-form" hidden>
        <div class="field">
          <label for="new-password">새 비밀번호</label>
          <input id="new-password" type="password" required minlength="6" autocomplete="new-password">
        </div>
        <button id="submit-button" class="btn-primary" type="submit">비밀번호 변경</button>
      </form>

      <p id="result" class="result">확인 중...</p>

      <p class="switch" id="back-to-login" hidden>
        <a href="login.html">로그인 화면으로</a>
      </p>
    </div>
  </main>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("password-form");
    const passwordInput = document.getElementById("new-password");
    const button = document.getElementById("submit-button");
    const result = document.getElementById("result");
    const backToLogin = document.getElementById("back-to-login");

    // 결과 문구 표시 (isError가 true면 빨간 오류 스타일)
    function showMessage(text, isError) {
      result.textContent = text;
      result.classList.toggle("error", Boolean(isError));
    }

    // Supabase 오류를 한국어 메시지로 바꾸기
    function toKoreanMessage(error) {
      if (error.code === "same_password") {
        return "이전과 다른 비밀번호를 입력해주세요";
      }
      if (error.code === "weak_password") {
        return "비밀번호가 너무 약해요: " + error.message;
      }
      return "실패했어요: " + error.message;
    }

    // 메일의 재설정 링크로 들어오면 Supabase가 주소에 담긴 정보로 자동 로그인시켜요.
    // 세션이 없으면 링크가 만료됐거나 이 페이지를 직접 연 경우예요.
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        showMessage("");
        form.hidden = false;
        passwordInput.focus();
      } else {
        showMessage("재설정 링크가 만료되었거나 올바르지 않아요. 다시 요청해주세요.", true);
        backToLogin.hidden = false;
      }
    }).catch((error) => {
      showMessage("실패했어요: " + error.message, true);
      backToLogin.hidden = false;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("변경 중...");
      button.disabled = true;

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: passwordInput.value });
        if (error) {
          showMessage(toKoreanMessage(error), true);
          button.disabled = false;
          return;
        }

        showMessage("비밀번호가 바뀌었습니다");
        form.hidden = true;

        // 재설정 링크로 로그인된 상태를 끝내야 login.html이 index.html로 넘기지 않아요.
        await supabaseClient.auth.signOut();

        // 문구를 잠깐 보여준 뒤 로그인 화면으로 이동
        setTimeout(() => {
          window.location.replace("login.html");
        }, 1500);
      } catch (error) {
        showMessage("실패했어요: " + error.message, true);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
