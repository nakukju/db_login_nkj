  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // 로그인 안 되어 있으면 내용을 보여주지 않고 바로 login.html로 이동

      if (!data.session) {
        window.location.replace("login.html");
        return;
      }
      document.body.hidden = false;
    }).catch(() => {
      window.location.replace("login.html");
    });
