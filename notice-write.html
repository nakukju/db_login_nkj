<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // ===== Supabase 설정 =====
    const SUPABASE_URL = "https://buokcgkkgwxsvtomoozw.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_idk2RhzFi8DYpMH3Z2ZE5w_JtgWXDbM";
    // ========================
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 작성</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!-- 로그인 확인 전까지 화면 전체를 숨겨 둠 -->
<body hidden>
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="logo-mark">P</span>
      <span>내 포트폴리오</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">홈</a>
      <a href="mypage.html">마이페이지</a>
      <a href="notice.html">공지사항</a>
    </nav>
  </header>

  <main class="page">
    <a href="notice.html" class="back-link">← 공지사항 목록</a>
    <h1>공지사항 작성</h1>

    <section class="write-card">
      <form id="notice-form" class="write-form">
        <div class="field">
          <label for="notice-category">분류</label>
          <!-- 값은 notice.html 탭과 같은 "공지" / "행사" / "안내" -->
          <select id="notice-category" required>
            <option value="" disabled selected>분류를 선택하세요</option>
            <option value="공지">공지</option>
            <option value="행사">행사</option>
            <option value="안내">안내</option>
          </select>
        </div>
        <div class="field">
          <label for="notice-title">제목</label>
          <input id="notice-title" type="text" required maxlength="10" aria-describedby="title-count">
          <p class="char-count" id="title-count">0 / 10</p>
        </div>
        <div class="field">
          <label for="notice-content">내용</label>
          <textarea id="notice-content" rows="10" required maxlength="20" aria-describedby="content-count"></textarea>
          <p class="char-count" id="content-count">0 / 20</p>
        </div>
        <div class="field">
          <label for="notice-image">사진 <span class="optional">(선택, jpg·png)</span></label>
          <input id="notice-image" class="file-input" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
        </div>
        <button id="submit-button" class="btn-primary" type="submit">등록</button>
      </form>
      <p id="result" class="result"></p>
    </section>
  </main>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("notice-form");
    const categorySelect = document.getElementById("notice-category");
    const titleInput = document.getElementById("notice-title");
    const contentInput = document.getElementById("notice-content");
    const imageInput = document.getElementById("notice-image");

    const IMAGE_BUCKET = "notice-images";
    const ALLOWED_IMAGE_TYPES = { "image/jpeg": "jpg", "image/png": "png" };
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024; // 5MB

    let currentUserId = ""; // 업로드 폴더 이름으로 사용 (로그인 확인 후 채워짐)
    const button = document.getElementById("submit-button");
    const result = document.getElementById("result");

    // 작성자 이름 (로그인 확인 후 채워짐)
    let authorName = "";

    // 결과 문구 표시 (isError가 true면 빨간 오류 스타일)
    function showMessage(text, isError) {
      result.textContent = text;
      result.classList.toggle("error", Boolean(isError));
    }

    // 글자수 제한 + "지금 글자수 / 최대 글자수" 표시 (최대 글자수는 각 칸의 maxlength 값)
    function setupCharCount(field, counter) {
      const max = Number(field.maxLength);

      function update() {
        // 한글 입력 중(조합 중)에는 브라우저에 따라 maxlength를 잠깐 넘을 수 있어서, 조합이 끝나면 잘라냄
        if (!field.isComposing && field.value.length > max) {
          field.value = field.value.slice(0, max);
        }
        const length = field.value.length;
        counter.textContent = length + " / " + max;
        counter.classList.toggle("full", length >= max); // 가득 차면 빨간색
      }

      field.addEventListener("input", (event) => {
        field.isComposing = event.isComposing;
        update();
      });
      field.addEventListener("compositionend", () => {
        field.isComposing = false;
        update();
      });
      return update;
    }

    const updateTitleCount = setupCharCount(titleInput, document.getElementById("title-count"));
    const updateContentCount = setupCharCount(contentInput, document.getElementById("content-count"));

    // 로그인 안 되어 있으면 내용을 보여주지 않고 바로 login.html로 이동
    supabaseClient.auth.getSession().then(({ data }) => {
      if (!data.session) {
        window.location.replace("login.html");
        return;
      }

      // 가입할 때 받은 이름 (없으면 이메일)
      const user = data.session.user;
      authorName = (user.user_metadata && user.user_metadata.name) || user.email;
      currentUserId = user.id;

      document.body.hidden = false;
      titleInput.focus();
    }).catch(() => {
      window.location.replace("login.html");
    });

    // 사진을 notice-images 버킷에 올리고 공개 주소를 돌려주기
    // 파일 경로: "내 계정 ID/시각-임의값.jpg" (이름이 겹치지 않게)
    async function uploadImage(file) {
      const ext = ALLOWED_IMAGE_TYPES[file.type];
      const path = currentUserId + "/" + Date.now() + "-" +
        Math.random().toString(36).slice(2, 10) + "." + ext;

      const { error } = await supabaseClient.storage
        .from(IMAGE_BUCKET)
        .upload(path, file, { contentType: file.type });
      if (error) throw error;

      const { data } = supabaseClient.storage.from(IMAGE_BUCKET).getPublicUrl(path);
      return { path, url: data.publicUrl };
    }

    // 등록 버튼을 누르면 (사진이 있으면 먼저 올리고) notices 테이블에 저장
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      const imageFile = imageInput.files[0] || null;
      const category = categorySelect.value;

      if (!["공지", "행사", "안내"].includes(category)) {
        showMessage("분류를 선택해주세요", true);
        categorySelect.focus();
        return;
      }

      if (title === "" || content === "") {
        showMessage("제목과 내용을 모두 입력해주세요", true);
        return;
      }

      // 사진 확인: jpg·png만, 5MB 이하만
      if (imageFile && !ALLOWED_IMAGE_TYPES[imageFile.type]) {
        showMessage("사진은 jpg, png 파일만 올릴 수 있어요", true);
        return;
      }
      if (imageFile && imageFile.size > MAX_IMAGE_BYTES) {
        showMessage("사진은 5MB 이하만 올릴 수 있어요", true);
        return;
      }

      button.disabled = true;
      let uploaded = null;

      try {
        // 1) 사진이 있으면 업로드 (업로드 중에만 "업로드 중..." 표시)
        if (imageFile) {
          showMessage("업로드 중...");
          try {
            uploaded = await uploadImage(imageFile);
          } catch (error) {
            showMessage("사진을 올리지 못했어요: " + error.message, true);
            return;
          }
        }

        // 2) 글 저장 (사진이 없으면 image_url은 넣지 않아 비어 있게)
        showMessage("등록 중...");
        const row = { category, title, content, author_name: authorName };
        if (uploaded) row.image_url = uploaded.url;

        const { error } = await supabaseClient.from("notices").insert(row);

        if (error) {
          // 글 저장에 실패하면 방금 올린 사진은 쓸 데가 없으니 지우기
          if (uploaded) {
            await supabaseClient.storage.from(IMAGE_BUCKET).remove([uploaded.path]);
          }
          showMessage("등록하지 못했어요: " + error.message, true);
          return;
        }

        showMessage("등록되었습니다");
        form.reset();
        updateTitleCount();
        updateContentCount();
      } catch (error) {
        showMessage("등록하지 못했어요: " + error.message, true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
