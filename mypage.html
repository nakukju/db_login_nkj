<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // ===== Supabase 설정 =====
    const SUPABASE_URL = "https://buokcgkkgwxsvtomoozw.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_idk2RhzFi8DYpMH3Z2ZE5w_JtgWXDbM";
    // ========================
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!-- 로그인 확인 전까지 화면 전체를 숨겨 둠 -->
<body hidden>
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="logo-mark">P</span>
      <span>내 포트폴리오</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">홈</a>
      <a href="mypage.html">마이페이지</a>
      <a href="notice.html">공지사항</a>
    </nav>
  </header>

  <main class="page">
    <h1>마이페이지</h1>

    <section class="profile-card">
      <p class="birthday" id="birthday" hidden>생일 축하합니다 🎂</p>
      <p class="profile-name" id="profile-name"></p>
      <p class="profile-bio" id="profile-bio" hidden></p>
      <p class="profile-meta">
        <span id="profile-email"></span>
      </p>
      <p class="profile-meta">
        가입일 <span id="profile-joined"></span>
      </p>
      <p class="profile-meta" id="profile-days"></p>
      <p class="profile-meta" id="profile-last-login" hidden></p>

      <label class="theme-toggle" for="dark-mode-switch">
        <span>다크모드</span>
        <input id="dark-mode-switch" class="switch-input" type="checkbox" role="switch">
        <span class="switch-track" aria-hidden="true"></span>
      </label>
      <p id="theme-error" class="result error" hidden></p>

      <button id="logout-button" class="btn-outline" type="button">로그아웃</button>
      <p id="logout-error" class="result error" hidden></p>
    </section>
  </main>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // 날짜를 "연-월-일" 형식으로 바꾸기 (예: 2026-11-25)
    function formatDate(isoString) {
      const date = new Date(isoString);
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    // 다크모드 적용: <html>에 data-theme="dark"를 붙이면 style.css의 다크 색이 적용돼요
    const darkModeSwitch = document.getElementById("dark-mode-switch");
    const themeError = document.getElementById("theme-error");

    function applyDarkMode(isDark) {
      if (isDark) {
        document.documentElement.dataset.theme = "dark";
      } else {
        delete document.documentElement.dataset.theme;
      }
      darkModeSwitch.checked = isDark;
    }

    // 스위치를 바꾸면 바로 적용하고 user metadata에 dark_mode로 저장
    darkModeSwitch.addEventListener("change", async () => {
      const isDark = darkModeSwitch.checked;
      applyDarkMode(isDark);
      themeError.hidden = true;
      darkModeSwitch.disabled = true;

      const { error } = await supabaseClient.auth.updateUser({ data: { dark_mode: isDark } });
      if (error) {
        // 저장에 실패하면 원래 상태로 되돌리기
        applyDarkMode(!isDark);
        themeError.textContent = "다크모드 설정을 저장하지 못했어요: " + error.message;
        themeError.hidden = false;
      }
      darkModeSwitch.disabled = false;
    });

    // 로그인 안 되어 있으면 내용을 보여주지 않고 바로 login.html로 이동
    supabaseClient.auth.getSession().then(({ data }) => {
      if (!data.session) {
        window.location.replace("login.html");
        return;
      }

      const user = data.session.user;
      const meta = user.user_metadata || {};

      // 저장된 다크모드 상태를 화면을 보여주기 전에 먼저 적용 (밝은 화면이 깜빡이지 않게)
      applyDarkMode(meta.dark_mode === true);

      document.getElementById("profile-name").textContent = meta.name || "이름 없음";

      // 한줄 소개: 입력했을 때만 이름 밑에 보여주기
      if (meta.bio) {
        const bio = document.getElementById("profile-bio");
        bio.textContent = meta.bio;
        bio.hidden = false;
      }

      // 생일: 생년월일("YYYY-MM-DD")의 월-일이 오늘(내 컴퓨터 날짜 기준)과 같으면 축하 메시지
      if (/^\d{4}-\d{2}-\d{2}$/.test(meta.birthdate || "")) {
        const today = formatDate(new Date().toISOString()).slice(5); // "MM-DD"
        if (meta.birthdate.slice(5) === today) {
          document.getElementById("birthday").hidden = false;
        }
      }

      // 좋아하는 색: "#rrggbb" 형식일 때만 카드 테두리 색으로 적용
      if (/^#[0-9a-fA-F]{6}$/.test(meta.favorite_color || "")) {
        document.querySelector(".profile-card").style.borderColor = meta.favorite_color;
      }

      document.getElementById("profile-email").textContent = user.email;
      document.getElementById("profile-joined").textContent = formatDate(user.created_at);

      // 가입한 지 N일째: 시각은 빼고 날짜(내 컴퓨터 기준 자정)끼리만 비교
      const joined = new Date(user.created_at);
      const joinedDay = new Date(joined.getFullYear(), joined.getMonth(), joined.getDate());
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.round((today - joinedDay) / (24 * 60 * 60 * 1000));
      document.getElementById("profile-days").textContent = "가입한 지 " + days + "일째";

      // 마지막 로그인: 세션의 사용자 정보에 들어 있는 last_sign_in_at 사용
      if (user.last_sign_in_at) {
        const lastLogin = document.getElementById("profile-last-login");
        lastLogin.textContent = "마지막 로그인: " + formatDate(user.last_sign_in_at);
        lastLogin.hidden = false;
      }

      document.body.hidden = false;
    }).catch(() => {
      window.location.replace("login.html");
    });

    // 로그아웃 버튼
    const logoutButton = document.getElementById("logout-button");
    const logoutError = document.getElementById("logout-error");

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        logoutError.textContent = "로그아웃에 실패했어요: " + error.message;
        logoutError.hidden = false;
        logoutButton.disabled = false;
        return;
      }
      window.location.replace("login.html");
    });
  </script>
</body>
</html>
