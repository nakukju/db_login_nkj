<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // ===== Supabase 설정 =====
    const SUPABASE_URL = "https://buokcgkkgwxsvtomoozw.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_idk2RhzFi8DYpMH3Z2ZE5w_JtgWXDbM";
    // ========================
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!-- 로그인 확인 전까지 화면 전체를 숨겨 둠 -->
<body hidden>
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="logo-mark">P</span>
      <span>내 포트폴리오</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">홈</a>
      <a href="mypage.html">마이페이지</a>
    </nav>
  </header>

  <main class="page">
    <h1>마이페이지</h1>

    <section class="profile-card">
      <p class="profile-name" id="profile-name"></p>
      <p class="profile-meta">
        <span id="profile-email"></span>
      </p>
      <p class="profile-meta">
        가입일 <span id="profile-joined"></span>
      </p>
      <button id="logout-button" class="btn-outline" type="button">로그아웃</button>
      <p id="logout-error" class="result error" hidden></p>
    </section>
  </main>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // 날짜를 "연-월-일" 형식으로 바꾸기 (예: 2026-11-25)
    function formatDate(isoString) {
      const date = new Date(isoString);
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    // 로그인 안 되어 있으면 내용을 보여주지 않고 바로 login.html로 이동
    supabaseClient.auth.getSession().then(({ data }) => {
      if (!data.session) {
        window.location.replace("login.html");
        return;
      }

      const user = data.session.user;
      const name = user.user_metadata && user.user_metadata.name;

      document.getElementById("profile-name").textContent = name || "이름 없음";
      document.getElementById("profile-email").textContent = user.email;
      document.getElementById("profile-joined").textContent = formatDate(user.created_at);

      document.body.hidden = false;
    }).catch(() => {
      window.location.replace("login.html");
    });

    // 로그아웃 버튼
    const logoutButton = document.getElementById("logout-button");
    const logoutError = document.getElementById("logout-error");

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        logoutError.textContent = "로그아웃에 실패했어요: " + error.message;
        logoutError.hidden = false;
        logoutButton.disabled = false;
        return;
      }
      window.location.replace("login.html");
    });
  </script>
</body>
</html>
